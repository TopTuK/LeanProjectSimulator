# Production compose: pulls prebuilt images tagged by the deploy workflow
# instead of building from source. Service names must stay `api` and `web`
# because frontend/nginx.conf proxies to http://api:8000.
#
# TLS and the public domain are handled by the shared nginx-proxy on the
# external `pmi_network`: only `web` joins it and advertises itself through
# VIRTUAL_HOST/VIRTUAL_PORT; `api` and `db` stay on the internal network.
# Per-host proxy settings live in deploy/vhost.d/ (copied to the proxy by hand).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simultrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simultrain}
      POSTGRES_DB: ${POSTGRES_DB:-simultrain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simultrain} -d ${POSTGRES_DB:-simultrain}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: simultrain-api:latest
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-simultrain}:${POSTGRES_PASSWORD:-simultrain}@db:5432/${POSTGRES_DB:-simultrain}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:?set YANDEX_CLIENT_ID in .env}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:?set YANDEX_CLIENT_SECRET in .env}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:?set YANDEX_REDIRECT_URI in .env}
      VK_CLIENT_ID: ${VK_CLIENT_ID:?set VK_CLIENT_ID in .env}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:?set VK_REDIRECT_URI in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # production is served over https, so the cookie needs the Secure flag
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: simultrain-web:latest
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST:-pmsim.pmi.moscow}
      VIRTUAL_PORT: "80"
    # loopback only, for debugging on the host; public traffic comes via nginx-proxy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8086}:80"
    networks:
      - default
      - pmi_network
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:

networks:
  pmi_network:
    external: true
